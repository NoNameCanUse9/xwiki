[package]
name = "xwiki"
version = "0.1.0"
edition = "2024"

[dependencies]
# Spike: crates.io gpui 0.2.x (platform features merged into the single
# gpui crate: default = font-kit + wayland + x11 + windows-manifest) and
# guise-ui (Mantine-inspired component library built on gpui, ships its
# own Lucide icons so no separate asset crate is needed).
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
guise-ui = "0.10"
markdown = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "cookies",
  "multipart",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
resvg = "0.45"
usvg = "0.45"
image = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3.0"
