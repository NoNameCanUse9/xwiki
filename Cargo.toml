[package]
name = "xwiki"
version = "0.1.0"
edition = "2024"

[dependencies]
# All zed crates unpinned so cargo resolves a single gpui for us and for
# gpui-component (which also depends on zed main). Reproducibility comes
# from Cargo.lock.
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = [
  "font-kit",
  "x11",
  "wayland",
  "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-css",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-markdown",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
markdown = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "cookies",
  "multipart",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
resvg = "0.45"
usvg = "0.45"
image = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3.0"
