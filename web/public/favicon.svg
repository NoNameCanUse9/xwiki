<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">XWiki application icon</title>
  <desc id="desc">A bright X mark with connected knowledge nodes on a deep graphite background.</desc>

  <defs>
    <linearGradient id="background" x1="72" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2845"/>
      <stop offset="0.52" stop-color="#10182C"/>
      <stop offset="1" stop-color="#090E1B"/>
    </linearGradient>
    <linearGradient id="mark" x1="142" y1="126" x2="370" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="0" cy="0" r="1" gradientTransform="translate(256 256) rotate(90) scale(148)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="72" y="72" width="368" height="368" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#background)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#8FB5E8" stroke-opacity="0.22" stroke-width="4"/>
  <circle cx="256" cy="256" r="156" fill="url(#center-glow)"/>

  <g opacity="0.22" fill="none" stroke="#8FB5E8" stroke-width="3">
    <path d="M90 160H154"/>
    <path d="M358 352H422"/>
    <path d="M352 154L408 98"/>
    <path d="M104 414L160 358"/>
  </g>

  <g opacity="0.34" filter="url(#soft-glow)" fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-width="78">
    <path d="M154 132L358 380"/>
    <path d="M358 132L154 380"/>
  </g>

  <g fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-width="58">
    <path d="M154 132L358 380"/>
    <path d="M358 132L154 380"/>
  </g>

  <g fill="#F8FAFC" stroke="#C7D2FE" stroke-width="4">
    <circle cx="154" cy="132" r="13"/>
    <circle cx="358" cy="132" r="13"/>
    <circle cx="154" cy="380" r="13"/>
    <circle cx="358" cy="380" r="13"/>
  </g>
  <circle cx="256" cy="256" r="25" fill="#F8FAFC"/>
  <circle cx="256" cy="256" r="11" fill="#647DFF"/>
</svg>
