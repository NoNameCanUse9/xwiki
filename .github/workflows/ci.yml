name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(find . -path ./web/node_modules -prune -o -name '*.go' -print0 | xargs -0 gofmt -l)"

      - name: Vet
        run: go vet ./...

      - name: Test Go
        run: go test ./... -count=1

      - name: Build server
        run: go build ./cmd/agentdocs

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Test Web
        working-directory: web
        run: npm test

      - name: Lint Web
        working-directory: web
        run: npm run lint

      - name: Build Web
        working-directory: web
        run: npm run build
