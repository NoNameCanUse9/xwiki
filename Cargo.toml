[package]
name = "xwiki-app"
version = "0.1.0"
edition = "2021"

[dependencies]
# All zed crates unpinned so cargo resolves a single gpui for us and for
# gpui-component (which also depends on zed main). Reproducibility comes
# from Cargo.lock.
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
